# ==============================================================================
# KHUNG HƯỚNG DẪN TỰ CODE LẠI TỪ ĐẦU (SCAFFOLDING GUIDE)
# ==============================================================================
#
# • Mục tiêu của file:
#   Tự động hóa việc tải, cấu hình và khởi chạy cơ sở dữ liệu PostgreSQL trong môi trường
#   cô lập (Docker container) phục vụ phát triển ứng dụng Fullstack mà không cần cài đặt cục bộ.
#
# • Các công cụ / Image cần dùng:
#   - Docker & Docker Compose: Công cụ đóng gói và điều phối container.
#   - Image 'postgres:alpine': Bản phân phối PostgreSQL chính thức dựa trên nền tảng Alpine Linux siêu nhẹ.
#
# • Các bước thực hiện:
#   Bước 1: Khai báo khối 'services' - định nghĩa danh sách các ứng dụng/dịch vụ cần chạy.
#   Bước 2: Định nghĩa service cơ sở dữ liệu (ví dụ: 'postgres'):
#           - Chỉ định base image và tag phiên bản (ưu tiên alpine để tiết kiệm tài nguyên).
#           - Đặt tên container cố định để dễ quản lý qua CLI.
#           - Thiết lập chính sách tự khởi động lại khi gặp sự cố.
#   Bước 3: Thiết lập các biến môi trường khởi tạo ('environment'):
#           - Cung cấp User, Password, Database Name mặc định mà Postgres yêu cầu khi boot lần đầu.
#   Bước 4: Ánh xạ cổng ('ports'):
#           - Map cổng máy thật (Host) vào cổng của container theo quy tắc: [Host_Port]:[Container_Port].
#   Bước 5: Thiết lập tính bền vững dữ liệu ('volumes'):
#           - Ánh xạ một Named Volume từ máy thật vào thư mục lưu trữ dữ liệu mặc định của Postgres.
#   Bước 6: Khai báo Named Volume ở cấp gốc (root level) để Docker Compose cấp phát tài nguyên lưu trữ.
#
# • Gợi ý khi bí (Hints để tra cứu Docs):
#   - Thuộc tính cấu hình: 'services', 'image', 'container_name', 'restart', 'environment', 'ports', 'volumes'
#   - Khái niệm Docker: "Named Volume", "Port Forwarding / Mapping", "Container Persistence"
#   - Lệnh điều khiển CLI: 'docker compose up -d', 'docker compose down', 'docker compose ps', 'docker exec'
#   - Đường dẫn dữ liệu mặc định của Postgres: '/var/lib/postgresql/data'
# ==============================================================================

services:
  postgres:
    # Tại sao chọn 'postgres:16-alpine'?
    # Alpine Linux là bản phân phối siêu tối giản (~40MB thay vì ~400MB bản chuẩn),
    # giúp tiết kiệm tối đa RAM và tốc độ tải image về máy nhanh hơn gấp nhiều lần.
    image: postgres:16-alpine

    # Tại sao cần đặt 'container_name'?
    # Giúp định danh container với một cái tên cố định dễ nhớ, phục vụ việc chạy các lệnh CLI
    # như `docker exec -it fullstack_postgres psql` mà không phải tìm ID ngẫu nhiên của Docker.
    container_name: fullstack_postgres

    # Tại sao dùng 'restart: always'?
    # Đảm bảo dịch vụ DB luôn sẵn sàng: Container sẽ tự khởi động lại nếu bị crash
    # hoặc khi bạn khởi động lại máy tính mà không cần gõ lệnh bật lại bằng tay.
    restart: always

    # Tại sao cần khối 'environment' này?
    # Image chính thức của PostgreSQL yêu cầu các thông số này để tự động chạy script
    # khởi tạo user quản trị và database mặc định ngay trong lần đầu tiên container khởi chạy.
    environment:
      POSTGRES_USER: dev_user # Tài khoản kết nối DB (dùng trong chuỗi DATABASE_URL)
      POSTGRES_PASSWORD: dev_password # Mật khẩu kết nối DB
      POSTGRES_DB: fullstack_db # Tên Database được tạo sẵn khi container khởi động

    # Tại sao map '5432:5432'?
    # Quy tắc: [Cổng máy Host]:[Cổng Container]. Mở cổng 5432 trên máy thật để các tiến trình ngoài Docker
    # (như Node.js app chạy localhost:5000, DBeaver, Prisma Studio) có thể kết nối vào DB bên trong container.
    ports:
      - "5432:5432"

    # Tại sao phải ánh xạ 'volumes'?
    # Container bản chất là vô trạng thái (ephemeral - xóa container là mất dữ liệu).
    # Ánh xạ ra Named Volume giúp toàn bộ file DB được lưu an toàn trên ổ cứng máy thật,
    # đảm bảo tắt máy hoặc restart container thì dữ liệu không bao giờ bị mất.
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Khai báo Named Volume ở cấp cao nhất (root-level)
# Báo cho Docker Engine biết cần khởi tạo một không gian lưu trữ độc lập trên ổ đĩa
# để gắn kết (mount) vào thư mục '/var/lib/postgresql/data' của container ở trên.
volumes:
  postgres_data:
