# ==============================================================================
# MỤC LỤC TỔNG QUAN (TABLE OF CONTENTS)
# Tài liệu hướng dẫn chi tiết: docs/01-register-guide.md
#
# 1. [01-docker-compose:service-postgres] - Khai báo & cấu hình dịch vụ cơ sở dữ liệu PostgreSQL
# 2. [01-docker-compose:named-volumes]    - Khai báo không gian lưu trữ dữ liệu bền vững (Named Volume)
# ==============================================================================

services:
  # ==============================================================================
  # KHUNG HƯỚNG DẪN CODE LẠI (FUNCTION-LEVEL SCAFFOLDING)
  # • Đầu đề định danh (Sub-ID): [01-docker-compose:service-postgres]
  # • Mục tiêu của cụm logic:
  #   Tự động tải, cấu hình thông số mạng và khởi chạy container PostgreSQL 16 cô lập phục vụ dự án.
  # • Đầu vào / Đầu ra (Input/Output):
  #   - Đầu vào: Docker Engine, thông tin đăng nhập DB (User, Password, Database Name), cổng mạng và volume lưu trữ.
  #   - Đầu ra: Tiến trình Container 'fullstack_postgres' lắng nghe cổng mạng TCP 5432 trên máy chủ.
  # • Các bước thực hiện:
  #   - Bước 1: Khai báo service với image PostgreSQL bản Alpine siêu nhẹ.
  #     + Mã giả: service.postgres.image = 'postgres:phiên_bản-alpine'
  #   - Bước 2: Đặt tên định danh cố định cho container và chính sách tự phục hồi khi gặp sự cố.
  #     + Mã giả: service.postgres.container_name = 'tên_container_cố_định'
  #     + Mã giả: service.postgres.restart = 'always'
  #   - Bước 3: Cung cấp các biến môi trường khởi tạo tài khoản và database mặc định theo yêu cầu của image.
  #     + Mã giả: service.postgres.environment = { POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB }
  #   - Bước 4: Ánh xạ cổng mạng giữa máy chủ thật (Host) và container theo quy tắc [Host_Port]:[Container_Port].
  #     + Mã giả: service.postgres.ports = ['cổng_host:cổng_container']
  #   - Bước 5: Gắn kết thư mục lưu trữ dữ liệu mặc định của Postgres vào Named Volume độc lập.
  #     + Mã giả: service.postgres.volumes = ['tên_named_volume:đường_dẫn_dữ_liệu_trong_container']
  # • Gợi ý khi bí (Hints):
  #   - Cấu trúc Compose: "services", "image", "container_name", "restart", "environment", "ports", "volumes"
  #   - Khái niệm kiến trúc: "Port Forwarding / Binding", "Container Ephemeral vs Persistence", "Alpine Linux Distribution"
  #   - Biến môi trường chuẩn Postgres: "Official PostgreSQL Docker Environment Variables (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)"
  #   - Đường dẫn dữ liệu Postgres: "PostgreSQL internal data directory (/var/lib/postgresql/data)"
  # ==============================================================================
  postgres:
    # Tại sao chọn 'postgres:16-alpine'?
    # Alpine Linux là bản phân phối siêu tối giản (~40MB thay vì ~400MB của bản thông thường),
    # giúp tối ưu hóa dung lượng ổ đĩa, tiết kiệm RAM và tăng tốc độ tải image khi khởi tạo môi trường.
    image: postgres:16-alpine

    # Tại sao cần đặt 'container_name'?
    # Tạo tên định danh cố định thay vì để Docker sinh mã hash ngẫu nhiên.
    # Giúp lập trình viên dễ dàng thao tác qua CLI như xem log (`docker logs -f fullstack_postgres`)
    # hoặc truy cập bash terminal (`docker exec -it fullstack_postgres psql`).
    container_name: fullstack_postgres

    # Tại sao dùng 'restart: always'?
    # Cơ chế tự phục hồi (High Availability / Fault Tolerance):
    # Container sẽ tự khởi động lại nếu tiến trình DB bị crash bất ngờ hoặc khi hệ điều hành máy chủ khởi động lại.
    restart: always

    # Tại sao cần khối 'environment' với các biến POSTGRES_*?
    # Script khởi tạo (entrypoint script) chính thức của image PostgreSQL sẽ đọc các biến này
    # để tự động tạo Superuser, thiết lập mật khẩu và khởi tạo Database mặc định ngay lần boot đầu tiên.
    environment:
      POSTGRES_USER: dev_user # Tài khoản quản trị kết nối DB (dùng trong DATABASE_URL của backend)
      POSTGRES_PASSWORD: dev_password # Mật khẩu xác thực kết nối DB
      POSTGRES_DB: fullstack_db # Tên cơ sở dữ liệu ban đầu cho dự án

    # Tại sao map '"5432:5432"'?
    # Cú pháp quy định: "[Cổng máy Host]:[Cổng bên trong Container]".
    # Mở cổng mạng 5432 của máy thật liên kết trực tiếp vào cổng 5432 của Postgres container,
    # cho phép ứng dụng Node.js ngoài Docker, Prisma ORM hoặc GUI Tool (DBeaver) kết nối vào.
    ports:
      - "5432:5432"

    # Tại sao phải ánh xạ 'volumes'?
    # Container mặc định có tính chất vô trạng thái (Ephemeral): Xóa container là mất toàn bộ dữ liệu.
    # Gắn kết vào Named Volume giúp toàn bộ file vật lý của DB được lưu độc lập trên ổ cứng máy host,
    # đảm bảo tính bền vững (Persistence) dù container có bị xóa hoặc tạo mới lại.
    volumes:
      - postgres_data:/var/lib/postgresql/data

# ==============================================================================
# KHUNG HƯỚNG DẪN CODE LẠI (FUNCTION-LEVEL SCAFFOLDING)
# • Đầu đề định danh (Sub-ID): [01-docker-compose:named-volumes]
# • Mục tiêu của cụm logic:
#   Khai báo tài nguyên lưu trữ độc lập ở cấp gốc (root-level) để Docker Engine quản lý vòng đời dữ liệu.
# • Đầu vào / Đầu ra (Input/Output):
#   - Đầu vào: Tên định danh của Named Volume ('postgres_data').
#   - Đầu ra: Một không gian lưu trữ vật lý trên máy host được Docker quản lý bền vững.
# • Các bước thực hiện:
#   - Bước 1: Khai báo từ khóa gốc 'volumes' ở cấp cao nhất của file cấu hình.
#     + Mã giả: volumes:
#   - Bước 2: Đăng ký tên định danh volume trùng khớp với tên volume đã mount trong service ở trên.
#     + Mã giả:   tên_volume_đã_dùng:
# • Gợi ý khi bí (Hints):
#   - Từ khóa Compose: "Top-level volumes key", "Named Volumes vs Host Bind Mounts"
#   - Lệnh kiểm tra Docker CLI: "docker volume ls", "docker volume inspect"
# ==============================================================================

# Tại sao khai báo 'volumes:' ở cấp cao nhất (root-level)?
# Thông báo cho Docker Engine cấp phát và quản lý một không gian lưu trữ vật lý độc lập (Named Volume)
# tách rời hoàn toàn khỏi vòng đời của bất kỳ container nào, cho phép dữ liệu tồn tại vĩnh viễn.
volumes:
  postgres_data:
